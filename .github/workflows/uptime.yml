name: Navigator uptime
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./check.sh
